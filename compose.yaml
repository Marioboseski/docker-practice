
services:
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - frontend_node_modules:/app/node_modules
    init: true

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_USER: web_shop_user
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in root .env}
      DATABASE_NAME: web_shop_db
      DATABASE_URL: mysql://web_shop_user:${DATABASE_PASSWORD}@db:3306/web_shop_db
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    command: sh -c "npx prisma migrate deploy && npm run dev"
    depends_on:
      db:
        condition: service_healthy
    init: true

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: web_shop_db
      MYSQL_USER: web_shop_user
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in root .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in root .env}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -u root --password="$$MYSQL_ROOT_PASSWORD" --silent'
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  frontend_node_modules:
  server_node_modules:
  mysql_data:
